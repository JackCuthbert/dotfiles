# --- Performance Caps ---
# Caps your maximum in-game frame rate to match a variable refresh rate monitor
# Jack: Monitor refresh rate - 3fps
fps_limit=162

# --- Display Toggles ---
# Enables the actual frames-per-second counter display
fps=1

# Forces the HUD to hide all other text rows and show ONLY the FPS number
fps_only

# --- Visual Styling & Position ---
# Anchors the FPS counter to the top-right corner of your monitor
position=top-right

# Sets the font size of the text (larger values increase visibility)
font_size=16

# --- Background & Layout Alignment ---
# Turns the background completely invisible (0.0 is fully transparent)
background_alpha=0.0

# Sets the background color hex code (irrelevant since alpha is zero)
background_color=000000

# Removes edge padding to prevent the invisible box from misaligning the text
frame_padding=0
background_padding=0

# --- Hidden System Stats ---
# Uses the newer, modern UI rendering engine for the layout
legacy_layout=0

# Ensures MangoHud stays visible on screen (set to 1 to hide the whole HUD)
no_display=0

# Disables tracking for CPU usage, temperatures, and clock speeds
cpu_stats=0

# Disables tracking for GPU usage, temperatures, and video memory clocks
gpu_stats=0

# Disables system RAM usage monitoring
ram=0

# Disables graphics card VRAM usage monitoring
vram=0

# Disables device battery status tracking (useful for laptops/handhelds)
battery=0
