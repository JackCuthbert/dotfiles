"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

[character]
success_symbol = '[λ](green)'
error_symbol = '[✖](red)'

[line_break]
disabled = false

[directory]
style = "bright-blue"

[git_metrics]
disabled = false
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
added_style = "bright-green"
deleted_style = "bright-red"

[git_branch]
format = "[$branch(:$remote_branch)]($style) "
style = "bright-black"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "white"
ahead = "↑"
behind = "↓"
diverged = "⇵"
deleted = "×"

[golang]
disabled = true

[java]
disabled = true

[nodejs]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true

[terraform]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[battery]
disabled = true

[pulumi]
format = '[$symbol ($version )$stack]($style) '

# Nerd Font symbols in place of the emoji defaults of starship.
#
# Stock starship uses emoji for 29 modules that this file leaves enabled. Only the
# modules that turn up on these machines are set here. Each other module is one
# line to add later.
#
# It needs a patched font (https://www.nerdfonts.com), or the glyphs show as boxes.

[hostname]
ssh_symbol = " "

[python]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = "󱘗 "

[lua]
symbol = " "

[swift]
symbol = " "

[git_commit]
tag_symbol = "  "

# Prefer the wrapper version; otherwise show the Gradle version managed by mise.
[gradle]
symbol = "󰟆 "
detect_extensions = []
detect_files = ['gradlew', 'gradlew.bat']
detect_folders = []

[custom.mise_gradle]
detect_files = ['build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts']
when = """
(test -f build.gradle || test -f build.gradle.kts || test -f settings.gradle || test -f settings.gradle.kts) \
&& [ ! -f gradle/wrapper/gradle-wrapper.properties ]
"""
command = "mise ls gradle --current | awk '{print $2}'"
format = "via [󰟆 $output](bold cyan) "

[kotlin]
symbol = "󱈙 "
