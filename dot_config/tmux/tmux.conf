# ~/.config/tmux/tmux.conf
# Sessions live long and get detached often. On reattach, the status bar and the
# window flags must show what needs attention.

# ---------------------------------------------------------------- general ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"   # truecolour
set -sg escape-time 10                                 # no ESC lag in editors
set -g focus-events on
set -g history-limit 100000                            # deep scrollback for build logs
set -g display-time 3000
set -g status-interval 15                              # cpu/ram fork a script each tick
setw -g aggressive-resize on

# Number windows and panes from 1, with no gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep sessions with no client. On destroy, move the client to another session.
set -g destroy-unattached off
set -g detach-on-destroy off

# The prefix stays the default C-b.

# ------------------------------------------------------------ titles/names ---
# Window name = the pane title without the "✳ " marker of Claude Code, else the
# ghq repo. tmux keeps the title in #{pane_title} even when allow-rename is off.
# Mirror the title as it is. A match on auto-generated titles once ate a session
# named that way. Only the "✳ Claude Code" splash is excluded. #{=/24/…} truncates.
# @repo_name takes the third element under the ghq root, not the basename, and
# gives ~ for $HOME. Both branches need #{E:}.
set -g @repo_name '#{?#{==:#{pane_current_path},#{HOME}},~,#{s|.*/||:#{s|^.*/Code/[^/]*/[^/]*/([^/]*).*|\1|:pane_current_path}}}'
setw -g automatic-rename on
setw -g automatic-rename-format '#{=/24/…:#{?#{m:✳ Claude Code,#{pane_title}},#{E:@repo_name},#{?#{m:✳ *,#{pane_title}},#{s|^✳ ||:pane_title},#{E:@repo_name}}}}'

# The outer terminal tab. tmux re-emits this on the client tty, so the tab follows
# the active window. It needs 'title' in #{client_termfeatures}. #h leads, so a tab
# on a remote box names that box.
set -g set-titles on
set -g set-titles-string '#h - #W'
setw -g allow-rename off      # apps can't hijack the window name

# ----------------------------------------------------------------- alerts ---
# Only a real BEL raises an alert: Claude Code wants permission, or a job
# finished. The ! flag survives a detach, so a reattach shows it.
# The activity and silence monitors stay off. Both alert on windows that want
# nothing, and silence rings a bell while visual-silence is off.
setw -g monitor-bell on
setw -g monitor-activity off
setw -g monitor-silence 0

set -g bell-action any     # ring even when the window is current
set -g visual-bell off     # ring the real bell, do not print a message

# ------------------------------------------------------------ mouse/copy ---
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on
set -ga terminal-features ',*:clipboard'   # OSC 52: copy reaches the local clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Middle-click paste
bind -n MouseDown2Pane paste-buffer -p

# ----------------------------------------------------------------- status ---
# Position and width only -- the contents come from catppuccin (theme.conf).
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

# --------------------------------------------------------------- bindings ---
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
# Splits open beside the current pane. New windows open at the session root.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window
# Pane navigation + resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Jump to the next window with an alert flag
bind a next-window -a

# ---------------------------------------------------------------- plugins ---
# TPM finds its own path from $XDG_CONFIG_HOME/tmux. `prefix I` installs and
# `prefix U` updates. On a new machine .chezmoiscripts clones TPM and installs the
# pins. plugins/ is machine state and stays chezmoiignored.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'   # provides #{cpu_percentage} and #{ram_percentage}
run '~/.config/tmux/plugins/tpm/tpm'

# ------------------------------------------------------------------ theme ---
source-file ~/.config/tmux/theme.conf
# tmux 3.6 fires these hooks when the terminal reports a background change.
set-hook -g client-light-theme 'source-file ~/.config/tmux/theme.conf'
set-hook -g client-dark-theme  'source-file ~/.config/tmux/theme.conf'
