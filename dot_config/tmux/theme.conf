# ~/.config/tmux/theme.conf
# Everything catppuccin. Sourced from tmux.conf and re-sourced by the
# client-{light,dark}-theme hooks, so a switch is one re-source.

# tmux 3.6 reports the terminal background as #{client_theme}. -F resolves it at
# once, so the option holds a value and not a format. With no client attached it
# is empty, and the dark flavour applies.
set -gF @catppuccin_flavor '#{?#{==:#{client_theme},light},latte,mocha}'

# The plugin only assigns colours that are unset, and its own @catppuccin_reset
# misses the status modules (and clears your @catppuccin_window_* along the way).
# Clearing every option holding a resolved hex is both smaller and complete.
# The window separators go too: the plugin derives the current-window ones
# with only-if-unset, so whatever the first load froze would otherwise stick.
# Runs before the options below, which it would otherwise wipe.
run "tmux show -g | grep -oE '^@(thm_[a-z0-9_]+|catppuccin_([a-z0-9_]+_color|status_[a-z0-9_]+_(icon|text)_(fg|bg)|window_[a-z_]*separator))' | xargs -rn1 tmux set -ugq"

# Tabs read "1 name#F": #W is the window name computed in tmux.conf, not
# catppuccin's #T default (the raw pane title), and flags stay literal rather
# than nerd-font icons.
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_flags 'text'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Move each module's gap from its trailing edge to its leading edge, so the
# last module butts straight up against the end cap instead of leaving a space.
# Spacing between modules is unchanged -- the gap just travels with the cap.
set -g @catppuccin_status_left_separator ' '
set -g @catppuccin_status_right_separator ''

# cpu and ram read from tmux-cpu. Point them straight at its scripts: that
# plugin substitutes its #{cpu_percentage} placeholders into status-right only,
# and here they sit inside an option it never sees. The colours would likewise
# resolve to an unusable literal, so take the standard module colours instead.
set -g @catppuccin_cpu_text ' #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)'
set -g @catppuccin_ram_text ' #(~/.config/tmux/plugins/tmux-cpu/scripts/ram_percentage.sh)'
set -g @catppuccin_status_cpu_text_fg '#{E:@thm_fg}'
set -g @catppuccin_status_cpu_text_bg '#{E:@catppuccin_status_module_text_bg}'
set -g @catppuccin_status_ram_text_fg '#{E:@thm_fg}'
set -g @catppuccin_status_ram_text_bg '#{E:@catppuccin_status_module_text_bg}'

# TPM clones catppuccin/tmux to plugins/tmux, after its repo name.
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# The README's recommended layout, plus host. Modules stay connected, with a
# single cap closing the right-hand end: it takes the colour of the segment it
# terminates, and bg=default inside the status line means the bar's own
# background. The first line replaces rather than appends, so a re-source
# cannot accumulate.
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_cpu}'
set -ag status-right '#{E:@catppuccin_status_ram}'
set -ag status-right '#{E:@catppuccin_status_session}'
# Host only when the client came in over ssh -- tmux refreshes SSH_CONNECTION
# from the client on every attach (see the update-environment option).
set -ag status-right '#{?SSH_CONNECTION,#{E:@catppuccin_status_host},}'
set -ag status-right '#[fg=#{E:@catppuccin_status_module_text_bg},bg=default]'

# After the run, because the plugin sets both: ! bell should read as more urgent
# than ~ silence.
set -gF window-status-bell-style 'bg=#{@thm_red},fg=#{@thm_crust},bold'
set -gF window-status-activity-style 'bg=#{@thm_yellow},fg=#{@thm_crust},bold'
